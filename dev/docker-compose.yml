
services:
  code-server:
    build: .
    container_name: code-server-jekyll
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Oslo
      - PASSWORD=password # Password to log into web VS Code
    volumes:
      - ~/.ssh:/config/.ssh
      - ~/.gitconfig:/config/.gitconfig
      - ../.:/config/workspace/rapporteket.github.io
    ports:
      - "127.0.0.1:8443:8443" # code-server web UI
      - "127.0.0.1:4000:4000" # Direct port mapping for Jekyll
